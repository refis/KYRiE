name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system libraries for PySide6 offscreen
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon0 libdbus-1-3 \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-render-util0 libxcb-shape0 libxcb-xfixes0 libxcb-xinerama0 \
            libfontconfig1 libfreetype6

      - name: Install Python dependencies
        run: python -m pip install -r requirements-lock.txt

      - name: Run feature-group suite (offscreen)
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          groups=$(python -m tools.run_tests --list | sed -n 's/:.*//p' | tr '\n' ' ')
          echo "groups: $groups"
          python -m tools.run_tests $groups
